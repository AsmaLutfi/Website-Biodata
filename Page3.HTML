<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 👩🏻‍🎓Pendidikan</title>
    <style>
        body {
            font-family: Little Summer, Little Summer;
            background-color: #A35C7A;
            color: white; /* Warna teks utama */
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background-color: #FFCCE1;
            padding: 65px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 500px;
            margin: auto;
            color: #A35C7A; /* Warna teks dalam container */
        }
        h2 {
            color: #8E3E63; /* Warna teks judul */
        }
        p {
            color: #8E3E63; /* Warna teks paragraf */
        }
        strong {
            color: #8E3E63; /* Warna teks yang ditebalkan */
        }
        button {
            background-color: white;
            color: #8E3E63; /* Warna teks dalam tombol */
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #f5f5f5;
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fefefe;
            border-radius: 50%;
            box-shadow: 0 0 10px #e1e1e1;
            animation: twinkle 1.5s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="sparkle" style="top: 30%; left: 80%;"></div>
    <div class="sparkle" style="top: 70%; left: 30%;"></div>
    <div class="sparkle" style="top: 80%; left: 50%;"></div>
    <div class="sparkle" style="top: 20%; left: 90%;"></div>
    <div class="sparkle" style="top: 50%; left: 10%;"></div>
    <div class="sparkle" style="top: 45%; left: 50%;"></div>
    <div class="sparkle" style="top: 80%; left: 20%;"></div>
    <div class="sparkle" style="top: 50%; left: 20%;"></div>
    <div class="sparkle" style="top: 10%; left: 70%;"></div>
    <div class="container" id="page3">
        <h2>🎓Pendidikan👩🏻‍🎓</h2>
        <img src="Universitas Tadulako.jpg" width="300" height="200" alt="Pendidikan">
        <p><strong>🏩 Universitas:</strong> Tadulako</p>
        <p><strong>🏢 Fakultas:</strong> Teknik</p>
        <p><strong>📚 Program Studi:</strong> S1 Sistem Informasi</p>
        <button onclick="window.location.href='index.html'">Halaman Utama</button>
        <button onclick="window.location.href='page2.html'">Kembali ke Halaman 2</button>
    </div>
</body>
</html>
