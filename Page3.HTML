<html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendidikan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #A35C7A;
            color: #A35C7A;
            margin: 0;
            padding: 0;
            text-align: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: #FFCCE1;
            padding: 80px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 500px;
        }
        img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 3px solid white;
        }
        button {
            background-color: white;
            color: #A35C7A;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 20px auto;
        }
        h2, p, strong {
            color: #A35C7A;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎓Pendidikan👩🏻‍🎓</h2>
        <img src="UniversitasTadulako.jpg" width="300" height="200" alt="Pendidikan">
        <p><strong>🏩 Universitas:</strong> Tadulako</p>
        <p><strong>🏢 Fakultas:</strong> Teknik</p>
        <p><strong>📚 Program Studi:</strong> S1 Sistem Informasi</p>
        <button onclick="window.location.href='informasi.html'">Kembali</button>
        <button onclick="window.location.href='index.html'">Halaman Utama</button>
    </div>
</body>
</html>
